<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="system-ui, sans-serif"><rect width="1400" height="1000" fill="#ffffff"/><text x="40" y="30" font-size="22" font-weight="700" fill="#20272B">Premium — vorläufige Montagebezüge (Seitenschnitt)</text><text x="40" y="52" font-size="13" fill="#53616A">Quelle: Premium500x300.fbx, abgelesen am 30.09.2026. Nummern ①–⑥ bitte bestätigen oder korrigieren. Referenzmodell: Dachneigung ≈ 12.2°, Trägerlänge ≈ 291.1 cm.</text><text x="40" y="505" font-size="13" fill="#20272B">① Trägerunterkante am Gartenende: 25 mm über der Unterkante der Regenrinne.</text><text x="40" y="525" font-size="13" fill="#20272B">② Trägerunterkante am Wandende: 13 mm über der Unterkante des Wandprofils.</text><text x="40" y="545" font-size="13" fill="#20272B">③ Träger beginnt 132 mm hinter der Pfostenvorderseite.</text><text x="40" y="565" font-size="13" fill="#20272B">④ Träger endet 18 mm vor der Wandfläche.</text><text x="40" y="585" font-size="13" fill="#20272B">⑤ Rinnenvorderkante 32 mm vor der Pfostenvorderseite; Rinne 204 × 166 mm.</text><text x="40" y="605" font-size="13" fill="#20272B">⑥ Pfostenoberkante 16 mm über der Rinnenunterkante (Pfosten steckt in der Rinne).</text><text x="40" y="625" font-size="13" fill="#20272B">Wandprofil 63 × 190 mm, Träger 118 mm hoch, Dachplatte 13 mm unter der Trägeroberkante.</text><text x="40" y="645" font-size="13" fill="#20272B">Dachneigung = atan((Höhe hinten + ② − Höhe vorne − ①) / (Tiefe − ③ − ④)); zulässig 5°–12°.</text><text x="40" y="665" font-size="13" fill="#20272B">Grau = Aluminium, blau = Dachplatte, rot = Maße. Nicht bestätigte Produktdaten.</text><rect x="40" y="70" width="640" height="400" fill="#f6f8f9" stroke="#738089"/><text x="50" y="90" font-size="14" font-weight="700" fill="#20272B">Detail Gartenseite (1 px = 1 mm)</text><clipPath id="clip4070"><rect x="40" y="98" width="640" height="372"/></clipPath><g clip-path="url(#clip4070)"><rect x="32