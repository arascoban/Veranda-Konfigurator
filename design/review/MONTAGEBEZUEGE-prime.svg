<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="system-ui, sans-serif"><rect width="1400" height="1000" fill="#ffffff"/><text x="40" y="30" font-size="22" font-weight="700" fill="#20272B">Prime — vorläufige Montagebezüge (Seitenschnitt)</text><text x="40" y="52" font-size="13" fill="#53616A">Quelle: Prime500x300.fbx, abgelesen am 30.09.2026. Nummern ①–⑥ bitte bestätigen oder korrigieren. Referenzmodell: Dachneigung ≈ 5.7°, Trägerlänge ≈ 295.1 cm.</text><text x="40" y="505" font-size="13" fill="#20272B">① Trägerunterkante am Gartenende: 31 mm über der Unterkante der Regenrinne.</text><text x="40" y="525" font-size="13" fill="#20272B">② Trägerunterkante am Wandende: 8 mm über der Unterkante des Wandprofils.</text><text x="40" y="545" font-size="13" fill="#20272B">③ Träger beginnt 53 mm hinter der Pfostenvorderseite.</text><text x="40" y="565" font-size="13" fill="#20272B">④ Träger endet 35 mm vor der Wandfläche.</text><text x="40" y="585" font-size="13" fill="#20272B">⑤ Rinnenvorderkante 26 mm vor der Pfostenvorderseite; Rinne 165 × 160 mm.</text><text x="40" y="605" font-size="13" fill="#20272B">⑥ Pfostenoberkante 15 mm über der Rinnenunterkante (Pfosten steckt in der Rinne).</text><text x="40" y="625" font-size="13" fill="#20272B">Wandprofil 55 × 160 mm, Träger 98 mm hoch, Dachplatte 11 mm unter der Trägeroberkante.</text><text x="40" y="645" font-size="13" fill="#20272B">Dachneigung = atan((Höhe hinten + ② − Höhe vorne − ①) / (Tiefe − ③ − ④)); zulässig 5°–12°.</text><text x="40" y="665" font-size="13" fill="#20272B">Grau = Aluminium, blau = Dachplatte, rot = Maße. Nicht bestätigte Produktdaten.</text><rect x="40" y="70" width="640" height="400" fill="#f6f8f9" stroke="#738089"/><text x="50" y="90" font-size="14" font-weight="700" fill="#20272B">Detail Gartenseite (1 px = 1 mm)</text><clipPath id="clip4070"><rect x="40" y="98" width="640" height="372"/></clipPath><g clip-path="url(#clip4070)"><rect x="3305.0" y=