<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" xml:lang="de">
  <title id="title">Terrassenkonfigurator — Profil im Detail — Designentwurf</title>
  <desc id="desc">Deutscher Entwurf für ein großes Profil-Inspektionsfenster. Die Profilillustration ist ausdrücklich ein Platzhalter, AR ist in dieser Vorschau noch nicht verfügbar.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#e9eff0" /><stop offset="1" stop-color="#dfe6e7" /></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".92" /><stop offset="1" stop-color="#f7f9f9" stop-opacity=".9" /></linearGradient>
    <linearGradient id="stage" x2="0" y2="1"><stop stop-color="#e7eff0" /><stop offset="1" stop-color="#f4f5f2" /></linearGradient>
    <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#758188" /><stop offset=".45" stop-color="#424d53" /><stop offset="1" stop-color="#303a3f" /></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#263238" flood-opacity=".18" /></filter>
  </defs>
