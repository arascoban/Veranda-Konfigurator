  <text x="1260" y="47" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#53616a">Prime · aktuelle Planung</text>
  <rect x="0" y="0" width="1440" height="900" fill="#20272b" fill-opacity=".2" />
  <rect x="145" y="95" width="1150" height="710" rx="28" fill="url(#glass)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
  <text x="184" y="146" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#65737a">PROFILANSICHT</text>
  <text x="184" y="185" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20272b">Trägerprofil im Detail</text>
  <text x="184" y="214" font-family="Arial,sans-serif" font-size="16" fill="#53616a">Das Einzelteil passend zum ausgewählten Produkt ansehen.</text>
  <rect x="1133" y="120" width="112" height="42" rx="21" fill="#fff" stroke="#c5ced1" />
  <text x="1189" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#354046">Schließen</text>
  <line x1="184" y1="238" x2="1255" y2="238" stroke="#d9e0e1" />

  <rect x="184" y="270" width="650" height="430" rx="22" fill="url(#stage)" stroke="#d7e0e2" />
  <text x="210" y="306" font-family="Arial,sans-serif" font-size="14" font-weight="650" fill="#53616a">3D-EINZELANSICHT · PLATZHALTER</text>
  <rect x="213" y="324" width="592" height="344" rx="16" fill="#fff" fill-opacity=".42" />
  <ellipse cx="511" cy="514" rx="230" ry="60" fill="#647178" opacity=".12" />
  
  <path d="M286 452 698 399 749 428 336 483Z" fill="url(#beam)" stroke="#354046" stroke-width="2" stroke-linejoin="round" />
  <path d="M336 483 749 428 749 453 338 508Z" fill="#303a3f" stroke="#39454b" stroke-width="1.5" />
  <path d="M286 452 336 483 338 508 286 477Z" fill="#59666c" stroke="#354046" stroke-width="1.5" />
  <path d="M303 455 697 405" stroke="#d7dddf" stroke-opacity=".78" stroke-width="3" />
  <rect x="210" y="624" width="382" height="34" rx="17" fill="#fff" fill-opacity=".94" stroke="#fff" />
  <circle cx="230" cy="641" r="6" fill="#68767d" />
