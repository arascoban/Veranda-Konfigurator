  <rect x="641" y="618" width="164" height="46" rx="23" fill="#fff" stroke="#c5ced1" />
  <text x="723" y="647" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#47545b">Ansicht drehen</text>

  <rect x="858" y="270" width="397" height="430" rx="22" fill="#fff" fill-opacity=".86" stroke="#fff" />
  <text x="888" y="309" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing=".6" fill="#65737a">AUSGEWÄHLTES PRODUKT</text>
  <text x="888" y="346" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20272b">Prime</text>
  <text x="888" y="374" font-family="Arial,sans-serif" font-size="16" fill="#53616a">Trägerprofil · leichtes Modell</text>
  <line x1="888" y1="396" x2="1225" y2="396" stroke="#e0e5e6" />
  <text x="888" y="430" font-family="Arial,sans-serif" font-size="15" font-weight="650" fill="#293238">Profildaten</text>
  <text x="888" y="459" font-family="Arial,sans-serif" font-size="14" fill="#53616a">Maße und technische Details</text>
  <text x="888" y="480" font-family="Arial,sans-serif" font-size="14" fill="#53616a">werden am freigegebenen Modell</text>
  <text x="888" y="501" font-family="Arial,sans-serif" font-size="14" fill="#53616a">angezeigt.</text>
  <rect x="888" y="525" width="337" height="62" rx="15" fill="#f0f3f3" />
  <circle cx="911" cy="556" r="9" fill="#fff" stroke="#748188" /><path d="M911 550v7l4 3" fill="none" stroke="#53616a" stroke-width="1.5" stroke-linecap="round" />
  <text x="933" y="551" font-family="Arial,sans-serif" font-size="14" font-weight="650" fill="#344047">Detailmodell wird geladen</text>
  <text x="933" y="573" font-family="Arial,sans-serif" font-size="13" fill="#65737a">Status folgt beim Modellwechsel.</text>
  <rect x="888" y="603" width="337" height="49" rx="24.5" fill="#e6e9ea" stroke="#d1d8da" />
  <text x="1056" y="633" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="650" fill="#6c777c">Auf meinem Tisch ansehen</text>
  <text x="888" y="676" font-family="Arial,sans-serif" font-size="13" fill="#65737a">AR-Vorschau nach Freigabe des Modells verfügbar.</text>

  <rect x="184" y="721" width="1071" height="52" rx="16" fill="#f3f5f5" />
  <text x="210" y="753" font-family="Arial,sans-serif" font-size="14" fill="#53616a">Beim Wechsel zu Premium wird dessen separates Detailmodell geladen; das aktuelle Produkt bleibt Prime.</text>
