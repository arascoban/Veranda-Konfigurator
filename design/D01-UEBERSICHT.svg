<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" xml:lang="de">
  <title id="title">Terrassenkonfigurator — Planungsübersicht — Designentwurf</title>
  <desc id="desc">Erweiterte Übersicht mit nachvollziehbaren Beispielmaßen, fehlendem Preis und getrennten PDF- und AR-Zuständen.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#e9eff0" /><stop offset="1" stop-color="#e0e6e7" /></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".94" /><stop offset="1" stop-color="#f9fbfb" stop-opacity=".9" /></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#263238" flood-opacity=".16" /></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#page)" />
  <rect x="20" y="14" width="1400" height="52" rx="26" fill="#fff" fill-opacity=".72" stroke="#fff" />
  <text x="52" y="47" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#293238">TERRASSENPLANER</text>
  <text x="1385" y="47" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#53616a">Entwurf · noch kein Angebot</text>
  <rect x="0" y="0" width="1440" height="900" fill="#20272b" fill-opacity=".16" />
  <rect x="180" y="86" width="1080" height="728" rx="28" fill="url(#glass)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
  <text x="220" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#65737a">IHRE PLANUNG</text>
  <text x="220" y="177" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20272b">Übersicht und nächste Schritte</text>
  <text x="220" y="207" font-family="Arial,sans-serif" font-size="16" fill="#53616a">Alle Angaben beziehen sich auf denselben Entwurf.</text>
  <rect x="1120" y="108" width="100" height="42" rx="21" fill="#fff" stroke="#c5ced1" />
  <text x="1170" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#354046">Schließen</text>
  <line x1="220" y1="229" x2="1220" y2="229" stroke="#d9e0e1" />

  <rect x="220" y="260" width="620" height="300" rx="20" fill="#eaf0f1" stroke="#d7e0e2" />
  <text x="246" y="296" font-family="Arial,sans-serif" font-size="14" font-weight="650" fill="#53616a">3D-ANSICHT · SCHEMATISCHER ENTWURF</text>
  <path d="M330 376 623 363 715 452 410 465Z" fill="#dce6e8" stroke="#465258" stroke-width="7" stroke-linejoin="round" />
  <path d="M410 465 715 452 715 466 410 479Z" fill="#394247" />
  <path d="M421 473 435 472 434 530 420 531ZM690 463 704 462 706 520 692 520ZM553 467 567 466 566 526 552 527Z" fill="#465158" />
  <g stroke="#fff" stroke-opacity=".85" stroke-width="2"><path d="M390 374 465 463" /><path d="M450 371 525 460" /><path d="M510 368 585 458" /><path d="M570 365 645 455" /><path d="M630 363 700 452" /></g>
  <text x="246" y="545" font-family="Arial,sans-serif" font-size="14" fill="#65737a">Illustration: 500 × 300 cm · keine Fertigungsdarstellung</text>

  <rect x="862" y="260" width="358" height="300" rx="20" fill="#fff" stroke="#e0e5e6" />
  <text x="888" y="296" font-family="Arial,sans-serif" font-size="14" font-weight="650" fill="#65737a">KONFIGURATION</text>
  <text x="888" y="331" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20272b">Prime · Glas</text>
  <line x1="888" y1="350" x2="1194" y2="350" stroke="#e0e5e6" />
  <text x="888" y="382" font-family="Arial,sans-serif" font-size="15" fill="#53616a">Breite</text><text x="1194" y="382" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="650" fill="#293238">500 cm</text>
  <text x="888" y="414" font-family="Arial,sans-serif" font-size="15" fill="#53616a">Tiefe</text><text x="1194" y="414" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="650" fill="#293238">300 cm</text>
  <text x="888" y="446" font-family="Arial,sans-serif" font-size="15" fill="#53616a">Höhe hinten / vorne</text><text x="1194" y="446" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="650" fill="#293238">240 / 220 cm</text>
  <text x="888" y="478" font-family="Arial,sans-serif" font-size="15" fill="#53616a">Dachfelder / Träger</text><text x="1194" y="478" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="650" fill="#293238">6 / 7</text>
  <text x="888" y="510" font-family="Arial,sans-serif" font-size="15" fill="#53616a">Beispielwerte aus dem Entwurf</text>

  <rect x="220" y="582" width="620" height="128" rx="20" fill="#fff" stroke="#e0e5e6" />
  <circle cx="251" cy="619" r="11" fill="#f4eee0" /><path d="M251 613v7l5 3" fill="none" stroke="#6b5a2a" stroke-width="1.7" stroke-linecap="round" />
  <text x="277" y="616" font-family="Arial,sans-serif" font-size="16" font-weight="650" fill="#293238">Preis noch nicht verfügbar</text>
  <text x="277" y="643" font-family="Arial,sans-serif" font-size="14" fill="#53616a">Die Preisliste fehlt. Ein Betrag wird erst mit gültigen Preisdaten angezeigt.</text>
  <text x="277" y="674" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#383e42">Diese Übersicht ist kein Angebot und keine Bestellbestätigung.</text>

  <rect x="862" y="582" width="358" height="128" rx="20" fill="#fff" stroke="#e0e5e6" />
  <text x="888" y="615" font-family="Arial,sans-serif" font-size="16" font-weight="650" fill="#293238">PDF-Entwurf</text>
  <text x="888" y="641" font-family="Arial,sans-serif" font-size="14" fill="#53616a">Maße und Preisstatus mitnehmen.</text>
  <rect x="888" y="656" width="306" height="40" rx="20" fill="#383e42" />
  <text x="1041" y="682" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="650" fill="#fff">Entwurf als PDF speichern</text>

  <rect x="220" y="730" width="1000" height="54" rx="17" fill="#f0f3f3" />
  <text x="246" y="753" font-family="Arial,sans-serif" font-size="14" font-weight="650" fill="#344047">AR im Garten</text>
  <text x="246" y="774" font-family="Arial,sans-serif" font-size="13" fill="#65737a">Wird verfügbar, sobald Modell und HTTPS-Verbindung freigegeben sind.</text>
  <rect x="1082" y="738" width="112" height="38" rx="19" fill="#e2e6e7" stroke="#cfd7d9" />
  <text x="1138" y="762" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="650" fill="#69757a">Noch nicht</text>
</svg>